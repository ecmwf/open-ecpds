[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:database]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=unexpected
startsecs=1
stopwaitsecs=60
priority=5
stdout_logfile=/data/log/master/database-supervisord.log
stderr_logfile=/data/log/master/database-supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:openbao]
command=/usr/local/ecpds/standalone/start-openbao.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/data/log/master/openbao-supervisord.log
stderr_logfile=/data/log/master/openbao-supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=10

[program:master]
command=/usr/local/ecpds/standalone/start-master.sh
user=ecpds-master
autostart=true
autorestart=true
startretries=3
stdout_logfile=/data/log/master/supervisord.log
stderr_logfile=/data/log/master/supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:mover]
command=/usr/local/ecpds/standalone/start-mover.sh
user=ecpds-mover
autostart=true
autorestart=true
startretries=3
stdout_logfile=/data/log/mover/supervisord.log
stderr_logfile=/data/log/mover/supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:monitor]
command=/usr/local/ecpds/standalone/start-monitor.sh
user=ecpds-monitor
autostart=true
autorestart=true
startretries=3
stdout_logfile=/data/log/monitor/supervisord.log
stderr_logfile=/data/log/monitor/supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:hawtio]
command=/usr/local/ecpds/standalone/start-hawtio.sh
user=ecpds-monitor
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
