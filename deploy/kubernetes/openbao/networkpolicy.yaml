apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-master-only
  labels:
    app.kubernetes.io/part-of: open-ecpds
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ecpds-master
      ports:
        - protocol: TCP
          port: 8200
