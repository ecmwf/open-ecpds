apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
components:
- ../../addons/hawtio
- ../../openbao
patches:
  - target:
      kind: Service
      name: ecpds-(database|master|monitor|mover)
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
