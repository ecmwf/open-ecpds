apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-openbao-0
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/data-openbao-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [ecpds-local-node]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-openbao-0
  labels:
    app.kubernetes.io/part-of: open-ecpds
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: data-openbao-0
  resources:
    requests:
      storage: 1Gi
