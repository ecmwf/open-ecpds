#
# File docker-compose.yml
#
# Purpose: Docker compose for deploying the OpenECPDS infrastructure in the MAC environment.
#
# In adition to the options configured in this file please also check the following:
#
# - etc/ecpds/database/mysqld.cnf
# - etc/ecpds/master/ecmwf.properties
# - etc/ecpds/monitor/ecmwf.properties
# - etc/ecpds/mover/ecmwf.properties
#
# (c) Copyright ECMWF 2019-2024 - Laurent Gougeon (syi@ecmwf.int)
#

networks:
  backbone:
    name: ecpds-backbone

services:
  # The OpenECPDS Database (MariaDB) enables persistent storage for configurations, metadata and history
  database:
    container_name: database
    hostname: ecpds-database
    image: ${ECPDS_REPOSITORY:-ecpds}/database:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "3309:3309" # Mysqld port must be the same as in 'etc/ecpds/database/mysqld.cnf'
    volumes:
      - "${ECPDS_ROOT_PATH:-}/var/lib/ecpds/database:/var/lib/mysql"
      - "${ECPDS_ROOT_PATH:-}/etc/ecpds/database:/etc/mysql/conf.d"
    networks:
      - backbone

  # The AI backend (Ollama) provides language model capabilities for OpenECPDS
  ai:
    profiles: ["ai"]   # <-- disabled unless profile is enabled
    container_name: ai
    hostname: ecpds-ai
    image: ${ECPDS_REPOSITORY:-ecpds}/ai:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "11434:11434" # Ollama API port
    environment:
      # Optional: limit memory/threads if desired
      OLLAMA_MAX_MEMORY: 10g
    volumes:
      - "${ECPDS_ROOT_PATH:-}/var/lib/ecpds/ai:/var/lib/ai" # persistent models & metadata
    networks:
      - backbone

  # The OpenECPDS Master-Server (backend) implements the business logic of the application
  # Also check the following configuration file: 'etc/ecpds/master/ecmwf.properties'
  master:
    container_name: master
    hostname: ecpds-master
    environment:
      # Setting initial, soft and maximum heap size
      INITIAL_MEMORY: 128M
      SOFT_MAX_MEMORY: 256M
      MAX_MEMORY: 1G
      # Exposed IP address used to bind the public services (ecpds, ftp)
      EXTERNAL_ADDRESS: 0.0.0.0
      # Dedicated to data traffic between the internal components (jmx, rmi)
      INTERNAL_ADDRESS: 0.0.0.0
      # Ports for the Master-Server services
      # Jolokia (JMX-over-HTTP), browsable from the hawtio service below. JOLOKIA_USER/
      # JOLOKIA_PASSWORD are read from your shell environment (not committed here) -
      # export them before 'make up svc=master' (from run/bin/ecpds), otherwise Jolokia
      # runs with no authentication at all.
      JOLOKIA_PORT: 2062
      JOLOKIA_HOST: 0.0.0.0
      JOLOKIA_USER: ${JOLOKIA_USER:-jolokia}
      JOLOKIA_PASSWORD: ${JOLOKIA_PASSWORD:-jolokia2021}
      PORT_CALLBACK: 2600 # Java Remote Method Invocation (communication between components)
      PORT_ECPDS: 2640 # Dedicated service for ecpds command
      PORT_FTP: 2021 # Virtual FTP Server
      # Shared secret for the ecpds CLI <-> Master-Server challenge-response authentication
      # (independent from, and does not need to match, the mover's RCC_SHARED_SECRET)
      CLI_SHARED_SECRET: "dboUz95GH4U8LihvnJPGfBce5/rFJdbYXoZesRXBIyQ="
      # Database related parameters (database interface/port must be the same as in 'etc/ecpds/database/mysqld.cnf')
      DATABASE_ALIAS: sequential://ecpds-database:3309/ecpds
      DATABASE_MIN_SPOOL_SIZE: 5
      DATABASE_MAX_SPOOL_SIZE: 50
      # Define rollover strategy for master.log
      LOG_ROLLOVER_SIZE_MAX: 100MB # Maximum size the log file is allowed to reach before being rolled over
      LOG_ROLLOVER_SIZE_KEEP: 20 # Maximum number of backup files to keep
      # Define rollover strategy for request.log, operator.log, event.log & splunk.log
      LOG_ROLLOVER_DATE_PATTERN: dd-MM-yyyy # Date pattern for renaming current log file after rollover
      LOG_ROLLOVER_DATE_KEEP: 10d # Keep backup files which are newer than the specified duration
      # Log levels for log4j2 (off, fatal, error, warn, info, debug, trace, all)
      LOG_LEVEL: debug
      # Interactions with various services (smtp, opsview)
      METADATA_MISSING_CONTACTS_MAIL:
      SMTP_HOST:
      SMTP_FROM:
      OPSVIEW_HOST:
      # Miscellaneous parameters
      RETRIEVAL_MAX_SPOOL_SIZE: 50 # Maximum number of parallel retrievals
      # Java Virtual Machine options
      JAVA_OPTS: -XX:+UseG1GC # The Garbage Collector
    image: ${ECPDS_REPOSITORY:-ecpds}/master:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "2021:2021" # ftp
      - "60000-60009:60000-60009" # ftp (passive mode)
      - "2640:2640" # ECpds
      - "2600:2600" # RMI
    volumes:
      - "${ECPDS_ROOT_PATH:-}/var/log/ecpds/master:/var/log/ecpds/master"
      - "${ECPDS_ROOT_PATH:-}/var/tmp/ecpds/master:/var/tmp/ecpds/master"
      - "${ECPDS_ROOT_PATH:-}/var/lib/ecpds/master:/var/lib/ecpds/master"
      - "${ECPDS_ROOT_PATH:-}/etc/ecpds:/etc/ecpds"
    networks:
      - backbone
    depends_on:
      - database

  # The Monitoring interface (frontend) allow monitoring, controlling and administrating the application
  monitor:
    container_name: monitor
    hostname: ecpds-monitor
    environment:
      # Setting initial, soft and maximum heap size
      INITIAL_MEMORY: 128M
      SOFT_MAX_MEMORY: 256M
      MAX_MEMORY: 1G
      # Exposed IP address used to bind the public services (http/s)
      EXTERNAL_ADDRESS: ecpds-monitor
      # Dedicated to data traffic between the internal components (jmx, rmi)
      INTERNAL_ADDRESS: ecpds-monitor
      # Ports for the Monitor-Server services
      # Jolokia (JMX-over-HTTP), browsable from the hawtio service below. JOLOKIA_USER/
      # JOLOKIA_PASSWORD are read from your shell environment (not committed here) -
      # export them before 'make up svc=monitor' (from run/bin/ecpds), otherwise Jolokia
      # runs with no authentication at all.
      JOLOKIA_PORT: 3062
      JOLOKIA_HOST: 0.0.0.0
      JOLOKIA_USER: ${JOLOKIA_USER:-jolokia}
      JOLOKIA_PASSWORD: ${JOLOKIA_PASSWORD:-jolokia2021}
      PORT_CALLBACK: 3600 # Java Remote Method Invocation (communication between components)
      PORT_HTTPS: 3443 # Web monitoring interface (https)
      # Connectivity to the Master-Server
      MASTER_ADDRESS: ecpds-master
      PORT_MASTER: 2600
      # Define rollover strategy for monitor.log
      LOG_ROLLOVER_SIZE_MAX: 100MB # Maximum size the log file is allowed to reach before being rolled over
      LOG_ROLLOVER_SIZE_KEEP: 20 # Maximum number of backup files to keep
      # Log levels for log4j2 (off, fatal, error, warn, info, debug, trace, all)
      LOG_LEVEL: debug
      # Password to unlock the 'etc/ecpds/monitor/ecpds-monitor.pfx' keystore
      KEYSTORE_PASSWORD: s5w8g771
      # Personalisation of monitoring web interface
      MONITOR_NICKNAME: "PDS"
      MONITOR_TITLE: "Personal Data Store"
      MONITOR_COLOR: "#0079d3"
      # Miscellaneous parameters
      USE_CACHE: "no"
      MASTER_URL_LIST: "ecpds-master:2600=Loopback export for testing"
      DEFAULT_SOURCE_HOST_ID:
      # Java Virtual Machine options
      JAVA_OPTS: -XX:+UseG1GC # The Garbage Collector
    image: ${ECPDS_REPOSITORY:-ecpds}/monitor:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "3443:3443" # https
      - "3600:3600" # RMI
    volumes:
      - "${ECPDS_ROOT_PATH:-}/var/log/ecpds/monitor:/var/log/ecpds/monitor"
      - "${ECPDS_ROOT_PATH:-}/var/tmp/ecpds/monitor:/var/tmp/ecpds/monitor"
      - "${ECPDS_ROOT_PATH:-}/etc/ecpds:/etc/ecpds"
    networks:
      - backbone
    depends_on:
      - master

  # The Data-Mover (frontend) make it possible to store objects and to perform incoming and outgoing
  # data transfers
  mover:
    container_name: mover
    hostname: ecpds-mover
    environment:
      # Setting initial, soft and maximum heap size
      INITIAL_MEMORY: 128M
      SOFT_MAX_MEMORY: 256M
      MAX_MEMORY: 1G
      # Exposed IP address used to bind the public services (http/s, ftp, sftp, ecproxy)
      EXTERNAL_ADDRESS: ecpds-mover
      # Dedicated to data traffic between the internal components (jmx, rmi)
      INTERNAL_ADDRESS: ecpds-mover
      # Ports for the Monitor-Server services
      # Jolokia (JMX-over-HTTP), browsable from the hawtio service below. JOLOKIA_USER/
      # JOLOKIA_PASSWORD are read from your shell environment (not committed here) -
      # export them before 'make up svc=mover' (from run/bin/ecpds), otherwise Jolokia
      # runs with no authentication at all.
      JOLOKIA_PORT: 4062
      JOLOKIA_HOST: 0.0.0.0
      JOLOKIA_USER: ${JOLOKIA_USER:-jolokia}
      JOLOKIA_PASSWORD: ${JOLOKIA_PASSWORD:-jolokia2021}
      PORT_CALLBACK: 4600 # Java Remote Method Invocation (communication between components)
      PORT_HTTP: 4080 # Web data-portal interface (http)
      PORT_HTTPS: 4443 # Web data-portal interface (https)
      PORT_MQTT: 4183 # MQTT interface (mqtt)
      PORT_MQTTS: 4883 # MQTT interface (mqtts)
      PORT_FTP: 4021 # Data-portal interface (ftp)
      PORT_SSH: 4022 # Data-portal interface (sftp/scp)
      PORT_ECPROXY: 4640 # Dedicated service for ecpds command
      # Connectivity to the Master-Server
      MASTER_ADDRESS: ecpds-master
      PORT_MASTER: 2600
      # Define rollover strategy for mover.log
      LOG_ROLLOVER_SIZE_MAX: 100MB # Maximum size the log file is allowed to reach before being rolled over
      LOG_ROLLOVER_SIZE_KEEP: 20 # Maximum number of backup files to keep
      # Log levels for log4j2 (off, fatal, error, warn, info, debug, trace, all)
      LOG_LEVEL: debug
      # Password to unlock the 'etc/ecpds/mover/ecpds-mover.pfx' keystore
      KEYSTORE_PASSWORD: s5w8g771
      # Shared secret for the Mover/Proxy REST control channel (RCC) authentication
      RCC_SHARED_SECRET: "2z14vqbu75XB3IRsddH0gztpXHbUGg9e2GaX3jFq3p0="
      # Personalisation of monitoring web interface
      MOVER_TITLE: "Personal Data Store (PDS)"
      MOVER_COLOR: "#0079d3"
      # Miscellaneous parameters
      OPERATION: "yes" # Set to 'no' to produce random data for missing files (for testing purpose only)
      # Java Virtual Machine options
      JAVA_OPTS: -XX:+UseG1GC # The Garbage Collector
    image: ${ECPDS_REPOSITORY:-ecpds}/mover:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "4080:4080" # http
      - "4443:4443" # https
      - "4183:4183" # mqtt
      - "4883:4883" # mqtts
      - "4021:4021" # ftp
      - "60010-60019:60010-60019" # ftp (Passive mode)
      - "4022:4022" # sftp
      - "4640:4640" # ECproxy
      - "4600:4600" # RMI
    volumes:
      - "${ECPDS_ROOT_PATH:-}/var/log/ecpds/mover:/var/log/ecpds/mover"
      - "${ECPDS_ROOT_PATH:-}/var/tmp/ecpds/mover:/var/tmp/ecpds/mover"
      - "${ECPDS_ROOT_PATH:-}/var/lib/ecpds/mover:/var/lib/ecpds/mover"
      - "${ECPDS_ROOT_PATH:-}/etc/ecpds:/etc/ecpds"
    networks:
      - backbone
    depends_on:
      - master

  # Hawtio web UI for browsing/operating the JMX MBeans exposed by Jolokia on
  # master/monitor/mover. Open http://localhost:8080/hawtio - master/mover/monitor
  # connections are pre-filled (HAWTIO_PRESET_CONNECTIONS below), using the same
  # JOLOKIA_USER/JOLOKIA_PASSWORD you exported for those services. Note: Hawtio
  # auto-opens each preset connection as a browser tab on every fresh visit to the bare
  # /hawtio/ URL (upstream behaviour) - bookmark a specific ?con=<id> URL to avoid that.
  #
  # Built from our own image (docker/ecpds/hawtio), not a third-party one - see
  # docs/monitoring/jmx-export.md for why. Not published to the host directly - only the
  # hawtio-proxy service below is, since that's what adds the login wall.
  #
  # Deliberately has no depends_on: Hawtio doesn't need master/monitor/mover to be
  # running (or even compose-managed) at startup, just reachable when you add a
  # connection, so starting it alone never pulls/builds the other images.
  hawtio:
    container_name: hawtio
    hostname: ecpds-hawtio
    image: ${ECPDS_REPOSITORY:-ecpds}/hawtio:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Set HAWTIO_JOLOKIA_HOST=host.docker.internal when master/monitor/mover run outside
      # Docker (e.g. launched from Eclipse/VS Code on the Mac host).
      HAWTIO_PRESET_CONNECTIONS: >-
        master=http://${HAWTIO_JOLOKIA_HOST:-ecpds-master}:2062/jolokia,
        mover=http://${HAWTIO_JOLOKIA_HOST:-ecpds-mover}:4062/jolokia,
        monitor=http://${HAWTIO_JOLOKIA_HOST:-ecpds-monitor}:3062/jolokia
      JAVA_OPTS: "-Dhawtio.proxyAllowlist=ecpds-master,ecpds-monitor,ecpds-mover,host.docker.internal"
    networks:
      - backbone

  # HTTP Basic Auth gatekeeper in front of Hawtio - our own image runs Hawtio with its
  # built-in authentication left disabled (io.hawt.embedded.Main.call() forces
  # hawtio.authenticationEnabled=false when unset), so Hawtio's own login can't be relied
  # on here. This nginx sidecar is the actual access control: nothing reaches Hawtio
  # without passing Basic Auth first. Requires HAWTIO_USER/HAWTIO_PASSWORD in your shell
  # environment (not committed here) - refuses to start without them.
  hawtio-proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      HAWTIO_USER: ${HAWTIO_USER:-hawtio}
      HAWTIO_PASSWORD: ${HAWTIO_PASSWORD:-hawtio2021}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$HAWTIO_USER" ] || [ -z "$$HAWTIO_PASSWORD" ]; then
          echo "ERROR: HAWTIO_USER/HAWTIO_PASSWORD must both be set - refusing to start" \
               "an unauthenticated gateway to Hawtio." >&2
          exit 1
        fi
        apk add --no-cache openssl > /dev/null
        printf '%s:%s\n' "$$HAWTIO_USER" "$$(openssl passwd -apr1 "$$HAWTIO_PASSWORD")" \
          > /etc/nginx/.htpasswd
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          location / {
            auth_basic "Hawtio";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://ecpds-hawtio:8080;
            proxy_set_header Host $$host;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "8080:80"
    networks:
      - backbone
    depends_on:
      - hawtio
