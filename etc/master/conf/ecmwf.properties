[Login]
# Master identity and addresses advertised to clients or used between components.
hostName=${ecmwf.common.ecaccess.ECaccessInit.getHostName()}
password=${ecmwf.common.ecaccess.ECaccessInit.getPassword()}

# Exposed IP address used to bind the public services (ecpds, ftp)
externalAddress=${Login[hostName]}

# Dedicated to data traffic between the internal components (jmx, rmi)
internalAddress=${master.internalAddress}

# Listening ports for Master services and callbacks.
[Ports]
ecpds=${port.ecpds}
ftp=${port.ftp}
callBack=${port.callback}

# Plugins started by this service: implementation class @ plugin library directory.
[PluginList]
# Plugin class, JAR, and per-plugin options (connection limit and reverse-DNS lookup).
ecpds=ecmwf.ecpds.master.plugin.ecpds.ECpdsPlugin@${master.lib}/plugin/ecpds.jar,maxConnections=1000,inverseResolution=no
ftp=ecmwf.common.ftpd.FtpPlugin@${master.lib}/plugin/ftp.jar,maxConnections=50,inverseResolution=no

# Optional startup-only identity extensions; blank class values preserve built-in behavior.
# Install trusted provider jars on the Master application classpath, then restart.
[AuthenticationExtension]
class=

[UserDirectoryExtension]
class=

# Interactive Monitor login is disabled until a provider and explicit local identity mappings are configured.
[InteractiveLoginExtension]
class=

[InteractiveLoginMapping]
# local-user={"issuer":"https://identity.example","subject":"provider-stable-subject"}

[OperationalEvents]
# Master event outputs and optional database journal; Splunk and OpenTelemetry are independent.
splunkEnabled=yes
openTelemetryEnabled=no
# Persist before OpenTelemetry export; install OPERATIONAL_EVENT before enabling.
# Unacknowledged events survive restarts. Database failures log errors and fail open.
journalEnabled=no
# journalOwner defaults to Login.root (then Login.hostName); keep it stable and unique.
# journalOwner=master
# Queue warning/critical thresholds; counts and oldest-admission age (milliseconds).
journalWarningPendingCount=1000
journalCriticalPendingCount=10000
journalWarningOldestAgeMillis=300000
journalCriticalOldestAgeMillis=1800000
# OpenTelemetry uses standard OTEL_* environment variables or -Dotel.* JVM options.
# The default transport is OTLP HTTP/protobuf; configure a trusted Collector endpoint.

[OpenTelemetry]
# Optional application metrics, independent of operational logs and transfer traces.
metricsEnabled=no
# Metric export interval and timeout in milliseconds.
metricsExportIntervalMillis=60000
metricsExportTimeoutMillis=30000
# Optional per-transfer-attempt traces, independent of operational log output.
# Movers forward sampled execution spans here; only the Master exports telemetry to the Collector.
tracesEnabled=no
# Sampling probability (0–1); queue and batch limits are spans; delay is milliseconds.
tracesSampleRatio=0.01
tracesMaxQueueSize=2048
tracesMaxExportBatchSize=512
tracesScheduleDelayMillis=1000
# Log batching defaults; with journaling enabled these limits apply to best-effort fallback delivery.
# Standard -Dotel.* JVM properties and OTEL_* environment settings override these values.
# Queue and batch limits are log records; schedule delay is milliseconds.
logsMaxQueueSize=2048
logsMaxExportBatchSize=512
logsScheduleDelayMillis=1000
# Connection settings (OTEL_EXPORTER_OTLP_ENDPOINT, PROTOCOL, TIMEOUT, etc.)
# belong in /etc/ecpds/master.cnf or the container/service environment.

# Network Weather admission limits: counts except maxConfigurationBytes, measured in bytes.
# Activation is controlled in the Monitor.
[NetworkWeather]
maxSources=20
maxSelectedPaths=50
maxCandidates=500
maxProbePolicies=50
maxHostChoices=5000
maxConfigurationBytes=49152

# Storage lifecycle policy worker; enabling it immediately honours existing ENFORCE policies.
#reload "StoragePolicy"
[StoragePolicy]
enabled=no
# Worker scan interval, per-step time budget, and batch/related-transfer caps.
interval=30s
batchSize=100
stepBudget=10s
maxRelatedTransfers=10000

[Server]
# Master services, schedulers, repositories, monitoring endpoints, and local data paths.
# Service and repository switches enable components; dontRecord* controls transfer-action history.
# providerMBeanTimeout is milliseconds; attachments and hostoutputs name local data directories.
transferScheduler=yes
hostCheckScheduler=no
acquisitionScheduler=yes
replicateScheduler=yes
downloadScheduler=yes
backupScheduler=yes
filterScheduler=yes
eventScheduler=yes
transferRepository=yes
ticketRepository=yes
historyRepository=yes
eventRepository=yes
notificationRepository=yes
mailRepository=${mail.activated}
email=
dontRecordTransferActions=yes
dontRecordActions=output,report
monitoringTaskScheduler=no
notifyLocalContainer=no
containersToNotify=ECpdsMonitor/(.*)
attachments=${master.data}/attachments
hostoutputs=${master.data}/hostoutputs
ecauth=ecauth
monitoring=https://${Login[hostName]}
useDataProxy=no
providerMBeanTimeout=180000
geoip2DataFile=${master.conf}/GeoLite2-City.mmdb
defaultTransferGroup=internet

[API]
# API client credentials and service-name regex allow-lists: clientId=secret:pattern.
api=api2021:.*

[Operator]
# Template for transfer-operation messages; $name expressions are expanded from transfer data.
template=$destination[name]: $dataFile[metaTime]-$dataFile[metaStream]($dataFile[timeStep]) -> $dataTransfer[target]($dataFile[formatSize]) $system[message] on $transferMethod[name]://$host[login]@$host[host]($host[nickname];$host[networkCode]) $dataTransfer[comment]

[TransferScheduler]
# Destination concurrency cap (0 means unlimited), pending-transfer fetch limit, monitoring cache.
poolSize=0
queueSize=55
monitoringCache=yes
# Cached monitoring result expiry in minutes.
monitoringTimeout=10

[ProxySocket]
# Cipher suite and host used by the Master proxy socket.
cipherSuites=SSL_RSA_WITH_NULL_MD5
host=${Login[hostName]}

[StorageRepository]
# Asynchronous persistence queue capacities and polling delays (delays in milliseconds).
storageRepositoryDelay=45000
storageThreadDelay=45000
historySize=15
historyDelay=1000
eventSize=15
eventDelay=1000
transferSize=25
transferDelay=1000
providerSize=5
providerDelay=1000
ticketSize=1
ticketDelay=45000
notificationSize=25
notificationDelay=45000

[MetaData]
# Metadata refresh interval and recipient for missing-contact notifications.
reload=24h
missingContactsMail=${metadata.missingContactsMail}

[Scheduler]
# Scheduler cadence, concurrency, jammed-thread detection, and per-job execution limits.
# Durations use the configuration duration syntax; minimumRateDownloadThread is a download-rate threshold.
# cacheRatio multiplies download-thread count to set the pending-transfer prefetch size.
cacheRatio=80
acquisitionScheduler=1s
maxAcquisitionThreads=140
acquisitionSchedulerJammedTimeout=10m
interruptSlowAcquisitionThread=yes
maximumDurationAcquisitionThread=10m
eventScheduler=1s
maxEventThreads=50
eventSchedulerJammedTimeout=10m
eventScriptFile=${master.etc}/event.js
timeOutEventThread=5m
downloadScheduler=1s
maxDownloadThreads=${retrieval.maxPoolSize}
downloadSchedulerJammedTimeout=10m
maximumDurationDownloadThread=25m
minimumDurationDownloadThread=5m
minimumRateDownloadThread=2359296
interruptSlowDownloadThread=yes
transferScheduler=1s
transferSchedulerJammedTimeout=5m
destinationThread=1s
destinationThreadJammedTimeout=5m
hostCheckScheduler=5m
hostCheckSchedulerJammedTimeout=30m
dataTransferCheck=5m
dataTransferCheckJammedTimeout=30m
filterScheduler=1s
filterSchedulerJammedTimeout=5m
maxFilterThreads=100
backupScheduler=1m
backupSchedulerJammedTimeout=10m
timeOutBackupThread=20m
maxBackupThreads=15
replicateScheduler=1s
replicateSchedulerJammedTimeout=10m
timeOutReplicateThread=20m
maxReplicateThreads=200
maxReplicateThreadsPerMover=15
purgeScheduler=1s
maxPurgeThreads=250
maxProxyThreads=150
removeExpiredDataTransfers=1
removeExpiredRoots=1
updateECUsers=24
updateECUsersTime=00:15:00
purgeDataBase=24
purgeDataBaseTime=00:15:00
exportDataBase=0

[DataBase]
# Database access, SQL resources, and cleanup policy. purge is hours; maxTransferLife is days.
brokerFactory=ecmwf.common.database.BrokerFactoryHibernate
repository=${master.conf}/sql
purge=360
backup=${master.conf}/backup.sql
user=master
password=ecmasdb
logEvents=yes
debugSql=no
protocol=jdbc
#driver=com.mysql.cj.jdbc.Driver
#subProtocol=mysql
driver=org.mariadb.jdbc.Driver
subProtocol=mariadb
alias=${database.alias}
# Enable cursor-based JDBC fetches for large result sets.
enableStreamingFetch=no
# Keep at most this many expired transfers per identity before deleting excess records.
maxIdentityCount=7
maxTransferLife=210

[Security]
# Authentication and TLS keystore credentials; cliSharedSecret authenticates CLI requests.
jaasModule=ecmwf
ejbUser=${Login[hostName]}
ejbPassword=${Login[password]}
SSLKeyStore=${master.etc}/ecpds-master.pfx
SSLKeyStorePassword=${Login[password]}
cliSharedSecret=${clisharedsecret.value}

[CallBack]
# Callback RMI endpoint and socket factories used for Master notifications.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
serverFactory=ecmwf.common.rmi.RMIServerSocketFactory
clientFactory=ecmwf.common.rmi.RMIClientSocketFactory
port=${Ports[callBack]}
keepAlive=yes

[RMIServerSocketFactory]
# Bind and advertised addresses and connection behavior for RMI server sockets.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

[RMIClientSocketFactory]
# Local/public addresses and connection behavior for RMI client sockets.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

[SocketConfig]
# Defaults for service sockets; buffer sizes are bytes and timeout values are milliseconds.
# -1 leaves socket buffer sizes to the platform.
listenAddress=${Login[externalAddress]}
publicAddress=${Login[externalAddress]}
receiveBufferSize=-1
sendBufferSize=-1
soTimeOut=86400000
connectTimeOut=30000
backLog=10000
keepAlive=yes
interruptible=no
trace=no

[Mail]
# SMTP host and account used by Master mail notifications.
host=${mail.host}
user=${mail.user}

[OpsViewManager]
# OpsView REST endpoints and account for publishing host configuration.
activated=${opsview.activated}
urlLogin=https://${opsview.host}/rest/login
urlHost=https://${opsview.host}/rest/config/host
urlReload=https://${opsview.host}/rest/reload
urlDetail=https://${opsview.host}/rest/detail
filterName=ECPDS_Destinations
user=grid-apiconfig
password=Che1Aesh
# When enabled, trustAllCerts skips TLS certificate validation for HTTPS connections.
trustAllCerts=yes

[Monitor]
# Optional external monitoring integration; delay uses the configuration duration syntax.
activated=no
delay=120
debug=no
dontSend=no

[ECpdsPlugin]
# Public ECpds service bind address, port, and socket read timeout (milliseconds).
listenAddress=${Login[externalAddress]}
port=${Ports[ecpds]}
soTimeOut=600000
checkPort=no
resetDataTransferSchedulesByGroup=yes

[RequestParser]
# Request logging and optional parser-based request ingestion.
logRequests=yes
useParser=no

[FtpPlugin]
# Public FTP control service, data timeouts (milliseconds), and user-facing text files.
listenAddress=${Login[externalAddress]}
port=${Ports[ftp]}
soTimeOut=600000
dataTimeOut=600000
passive=yes
extended=yes
ext=
tail=FTP Admin Interface
welcome=${master.conf}/ftp/welcome.txt
browser=${master.conf}/ftp/browser.txt
help=${master.conf}/ftp/help.txt
hidden=
extended=no

[FtpDomainList]
# FTP/SFTP virtual directory names and their backing domains; * is the fallback mapping.
attachments=attachments:
destinations=destinations:
countries=countries:
hosts=hosts:
data=data:
types=types:
*=*

[FTPPassiveSocket]
# FTP passive data port allocation range and socket timeout (milliseconds).
privilegedLocalPort=yes
minPrivilegedPort=50000
maxPrivilegedPort=60000
soTimeOut=300000

[FTPActiveSocket]
# FTP active data socket timeout (milliseconds) and local-port reuse behavior.
soTimeOut=7200000
reuseAddress=yes

[GeoIP]
# Optional forced geolocation for the matching address prefix (latitude,longitude,region,country,city).
forced.136.156=44.520320,11.360250,Europe,IT,Bologna

[Other]
# Shared utility settings: buffer is bytes; tmp selects the temporary-file directory.
# dontCheckIp disables the ECaccess provider's client-address check during subscription.
buffer=131072
tmp=${master.tmp}
dontCheckIp=yes

# Allow overriding some options/parameters in this file
#
#include "${master.etc}/ecmwf.properties"
