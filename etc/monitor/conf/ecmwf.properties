# ${...} values come from JVM properties, other sections or evaluated methods.
# These are startup defaults; restart the Monitor after changing this file.
# Service identity for Master registration; HTTPS certificates are set in [Security].
[Login]
# Local hostname; used as the service identity and default advertised address.
hostName=${ecmwf.common.ecaccess.ECaccessInit.getHostName()}
# Master registration credential; not the web-user or HTTPS-keystore password.
password=${ecmwf.common.ecaccess.ECaccessInit.getPassword()}
# Registered service type; keep consistent with the Master's service configuration.
service=ECpdsMonitor

# Master hostname/IP, supplied by the launcher.
masterServer=${master.address}

# Monitor address used by public-facing socket defaults; not the Master address.
externalAddress=${Login[hostName]}

# Local interface for internal RMI callbacks and client sockets.
internalAddress=${monitor.internalAddress}

# TCP ports: Monitor HTTPS, local RMI callback and remote Master registry.
# Ensure listening ports do not conflict with another service.
[Ports]
https=${port.https}
callBack=${port.callback}
master=${port.master}

# Plugins started by this service: implementation class @ plugin library directory.
[PluginList]
http=ecmwf.ecpds.master.plugin.http.HttpPlugin@${monitor.lib}/plugin/http

# Remote Master RMI registry used by the Monitor's data/management client.
[ECpds]
host=${Login[masterServer]}
port=${Ports[master]}

# HTTPS PKCS#12 keystore and its password; this is separate from Master login.
[Security]
SSLKeyStore=${monitor.etc}/ecpds-monitor.pfx
SSLKeyStorePassword=${keystore.password}

# Shared socket defaults, overridden by named socket sections below.
# Buffer sizes are bytes (-1 keeps OS defaults); timeouts are milliseconds.
[SocketConfig]
listenAddress=${Login[externalAddress]}
publicAddress=${Login[externalAddress]}
receiveBufferSize=-1
sendBufferSize=-1
soTimeOut=86400000
connectTimeOut=30000
# Maximum queued incoming connections awaiting accept.
backLog=500
# TCP keepalive, interruptible NIO sockets and socket diagnostics, respectively.
keepAlive=yes
interruptible=no
trace=no

# RMI endpoint exported by the Monitor so the Master can send callbacks.
# listenAddress binds locally; publicAddress is advertised to the peer.
[CallBack]
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
serverFactory=ecmwf.common.rmi.RMIServerSocketFactory
clientFactory=ecmwf.common.rmi.RMIClientSocketFactory
port=${Ports[callBack]}
keepAlive=yes

# Inbound RMI socket settings; inherit unspecified [SocketConfig] values.
[RMIServerSocketFactory]
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

# Outbound RMI socket settings; listenAddress selects the local source interface.
[RMIClientSocketFactory]
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

# External service-status reporting, independent of the web monitoring UI.
[Monitor]
# Enable status submissions; debug logs submissions; dontSend suppresses delivery.
activated=no
# Submission scheduler delay: bare values are hours; suffixes include s, m, h, d.
delay=120
debug=no
dontSend=no

# Web UI listener, TLS and monitoring-display settings.
[MonitorPlugin]
# Bind address and allowed TLS protocol versions.
listenAddress=${Login[externalAddress]}
enabledProtocols=TLSv1.3,TLSv1.2
# Calculate product/destination statuses in the background.
statusCalculator=true
# Stuck-task watchdog limits, in minutes (not refresh intervals).
statusCalculatorTimeout=15
destinationProductStatusResetterTimeout=20
https=${Ports[https]}
htdocs=${monitor.htdocs}
# Request optional TLS client certificates; does not require them.
wantClientAuth=no
# Retained flag; no current Monitor consumer. HTTPS is configured above.
checkIsSecure=yes
# Background destination-status refresh interval, in milliseconds.
refreshDelay=20000
# Retained flag; not a production security switch in the current Monitor.
production=false
# Browser session-cookie name; use distinct names for co-hosted Monitor instances.
cookie=ecpdsv2
# Destinations displayed per monitoring page/column.
destinationsPerPageOrColumn=46
# Product-status window counts for detail and header displays.
productsToShowCount=10
productsToShowHeaderCount=50
# Forward product-status window, in hours.
productsToShowPeriod=168
# Restrict displayed product statuses to monitored destinations.
productsToShowMonitoredOnly=no
# Ignore product-status events older than this many days.
productStatusEventMaxAge=7
# Destination entries per column on destination details.
destinationsPerColumn=25
# Login form methods: password, otp, or password,otp; not an authentication bypass.
authMode=password
# Animate the login-page background.
loginAnimatedBackground=true

# Defaults for destination editing and Master links.
[DestinationActionForm]
# Default source Host ID for a new destination; masterURLs is a URL list.
hostForSourceName=${defaultSourceHostId}
masterURLs=${master.urlList}

# Monitor-side cache of Master metadata; reduces repeated remote lookups.
[MasterManager]
useCache=${monitor.useCache}

# Shared service settings; eventRepository is used by the Master, not this Monitor.
[Server]
eventRepository=no
# Optional: persist the self-hosted higher-resolution "Live Earth" globe imagery
# tile cache across restarts (defaults to a subdirectory of java.io.tmpdir).
#globeImageryCacheDir=/var/lib/ecpds/monitor/globe-imagery
# Optional: persist the "Live Earth" globe country/city name labels cache across
# restarts (defaults to a subdirectory of java.io.tmpdir).
#globeLabelsCacheDir=/var/lib/ecpds/monitor/globe-labels

# Shared Master event-batch settings; not activated by the Monitor service.
# eventSize is records per batch; eventDelay is milliseconds.
[StorageRepository]
eventSize=20
eventDelay=1000

# Shared transfer buffer size (bytes) and temporary workspace path.
[Other]
buffer=131072
tmp=${monitor.tmp}

# Allow overriding some options/parameters in this file
#
#include "${monitor.etc}/ecmwf.properties"
