#
# File jmx_exporter.yml
#
# Purpose: Prometheus JMX exporter mapping rules for the Data-Mover (OpenECPDS)
#
# Used only when PROMETHEUS_JMX_PORT is set (see docs/monitoring/jmx-export.md).
# Per-transfer MBeans are excluded to avoid unbounded metric cardinality. Narrow the
# "pattern" rules below once you know which metrics you actually want in Grafana.
#

startDelaySeconds: 0
lowercaseOutputName: false
lowercaseOutputLabelNames: false
excludeObjectNames:
  - "Transfer:*"
rules:
  - pattern: ".*"
