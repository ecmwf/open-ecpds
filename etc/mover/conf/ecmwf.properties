# Mover identity; hostName is supplied by the launcher and must match the
# database entry. Its password is derived from the name by GatewayInit.
#
[Login]
hostName=${ecmwf.common.ecaccess.ECaccessInit.getHostName()}
password=${ecmwf.common.ecaccess.ECaccessInit.getPassword()}

# Master daemon address; externalAddress is the mover's advertised/NAT
# address, while internalAddress is used for private service connections.
#
masterServer=${master.address}

externalAddress=${Login[hostName]}

internalAddress=${mover.internalAddress}

# Listening ports for mover services and master callbacks. Stop any
# existing daemon before assigning its port here.
#
[Ports]
http=${port.http}
https=${port.https}
mqtt=${port.mqtt}
mqtts=${port.mqtts}
ecproxy=${port.ecproxy}
ftp=${port.ftp}
ssh=${port.ssh}
master=${port.master}
callBack=${port.callback}

# Services started by the mover. FTP/ECproxy limits are concurrent
# connections; inverseResolution controls reverse-DNS lookup of clients.
#
[PluginList]
http=ecmwf.ecpds.mover.plugin.http.HttpPlugin
mqtt=ecmwf.ecpds.mover.plugin.mqtt.MqttPlugin
ftp=ecmwf.common.ftpd.FtpPlugin,maxConnections=2000,inverseResolution=no
ssh=ecmwf.ecpds.mover.plugin.ssh.SshPlugin
ecproxy=ecmwf.ecpds.mover.plugin.ecproxy.ECproxyPlugin,maxConnections=2000,inverseResolution=no

# Core runtime settings follow; change only when the deployment requires it.

[MasterServer]
# Master daemon host and port, taken from Login and Ports above.
host=${Login[masterServer]}
port=${Ports[master]}

# Optional HTTP tunnel: proxy URL, mover URL and connection timeout (ms).
#[MoverProxy]
#httpProxy=
#httpMover=
#connectTimeout=30000

[Security]
# HTTPS key store and its password; shared secrets authenticate RCC and CLI
# requests. Keep the secrets private and use a protected key-store file.
SSLKeyStore=${mover.etc}/ecpds-mover.pfx
SSLKeyStorePassword=${keystore.password}
rccSharedSecret=${rccsharedsecret.value}
cliSharedSecret=${clisharedsecret.value}

[Mover]
# Whether this mover is marked operational and available for work.
operational=${mover.operation}

[Scheduler]
# Repository polling periods and jammed-item thresholds (duration units).
transferRepository=1s
transferRepositoryJammedTimeout=5m
downloadRepository=1s
downloadRepositoryJammedTimeout=5m

[CallBack]
# Callback/RMI traffic is restricted to the internal interface; port is
# selected above. keepAlive enables persistent TCP connections.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
serverFactory=ecmwf.common.rmi.RMIServerSocketFactory
clientFactory=ecmwf.common.rmi.RMIClientSocketFactory
port=${Ports[callBack]}
keepAlive=yes

[RMIServerSocketFactory]
# RMI server socket bind/advertised addresses and connection behavior.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

[RMIClientSocketFactory]
# RMI client local/public addresses and connection behavior.
listenAddress=${Login[internalAddress]}
publicAddress=${Login[internalAddress]}
interruptible=yes
keepAlive=yes

[SocketConfig]
# Defaults for service sockets. Addresses bind/advertise externally here;
# buffer sizes are bytes (-1 uses system defaults), timeouts are ms,
# backLog is the pending-connection queue limit, and trace logs socket I/O.
listenAddress=${Login[externalAddress]}
publicAddress=${Login[externalAddress]}
receiveBufferSize=-1
sendBufferSize=-1
soTimeOut=86400000
connectTimeOut=30000
backLog=10000
keepAlive=yes
trace=yes

[ProxySocket]
# plainText=yes disables TLS on this proxy socket; use only on trusted links.
plainText=yes

[Monitor]
# Monitoring activation, report interval (duration), debug logging and
# notification suppression.
activated=no
delay=120
debug=no
dontSend=no

[HttpPlugin]
# HTTP/HTTPS listeners, document root, and static page paths. TLS is limited
# to the listed protocol versions.
http=${Ports[http]}
https=${Ports[https]}
htdocs=${mover.htdocs}
listenAddress=${Login[externalAddress]}
enabledProtocols=TLSv1.3,TLSv1.2
homeFile=${mover.conf}/http/home.html
loginFile=${mover.conf}/http/login.html
portalFile=${mover.conf}/http/portal.html
registerFile=${mover.conf}/http/register.html

[MqttPlugin]
# MQTT listeners and paths for broker configuration and persistent data.
mqtt=${Ports[mqtt]}
mqtts=${Ports[mqtts]}
listenAddress=${Login[externalAddress]}
configurationFolder=${mover.conf}/mqtt
dataFolder=${mover.mqtt}

[ECproxyPlugin]
# ECproxy listener and local repository; socket timeout is ms and optional
# buffer overrides are bytes.
listenAddress=${Login[externalAddress]}
publicAddress=${Login[externalAddress]}
port=${Ports[ecproxy]}
soTimeOut=600000
repository=${mover.data}
#sendBufferSize=128000
#receiveBufferSize=524288

# Optional per-command FTP socket settings (PASV, PORT and OPEN).
#[FtpPASV]
#[FtpPORT]
#[FtpOPEN]

[RetrievalInputStream]
# Retrieval buffering, cancellation support, and progress-update interval.
buffered=yes
interruptible=yes
monitored=1m

[ReplicationHost]
# Replication connections bind to the internal interface.
listenAddress=${Login[internalAddress]}

[ECauthModule]
# ECauth lookup endpoint and SSH credentials; timeout/cache values are
# durations (delay/frequency control refresh, lifetime controls cache age).
listenAddress=${Login[internalAddress]}
connectionTimeout=30s
protocol=ssh
user=ecauth
pass=ecauth
hostListManagerDelay=10s
hostListManagerLifeTime=1h
hostListManagerFrequency=5m

[Filter]
# Transfer filters: pre.out commands transform files via $1/$2 paths;
# fly.* commands stream compression/decompression to standard I/O.
pre.out.gzip=${mover.sh}/gzip $1 $2
pre.out.bzip2a=${mover.sh}/bzip2 $1 $2
pre.out.lbzip2=${mover.sh}/lbzip2 $1 $2
fly.out.lbzip2=lbzip2 -c
fly.in.lbzip2=lbzip2 -d
fly.out.zstd=zstd -6 -T0 --no-progress -c
fly.in.zstd=zstd -d --no-progress -c

[DataPortal]
# Optional public URLs/hosts and protocol toggles used in portal pages;
# registrationAdminEmail receives registration notices.
#httpsPublicBaseUrl=
#s3PublicEndpointUrl=
#s3Enabled=true
#ftpPublicHost=
#ftpPublicPort=
#ftpEnabled=true
#sftpPublicHost=
#sftpPublicPort=
#sftpEnabled=true
#registrationAdminEmail=

[FtpPlugin]
# FTP listener, socket/data timeouts (ms), passive mode, banners/help files,
# hidden domains and retrieval-time file checks.
listenAddress=${Login[externalAddress]}
port=${Ports[ftp]}
soTimeOut=600000
dataTimeOut=600000
passive=yes
extended=yes
ext=
tail=${mover.title}
welcome=${mover.conf}/ftp/welcome.txt
browser=${mover.conf}/ftp/browser.txt
help=${mover.conf}/ftp/help.txt
hidden=
#restrictedUsers=
alwaysCheckOnRETR=yes

[FtpDomainList]
# FTP virtual-domain mappings; * is the default domain mapping.
data=data:
*=*

[FTPPassiveSocket]
# Timeout for FTP passive data sockets (ms).
soTimeOut=300000

[FTPActiveSocket]
# Timeout for FTP active data sockets (ms); reuseAddress permits rebinding.
soTimeOut=300000
reuseAddress=yes

[SshPlugin]
# SSH/SFTP listener, host keys, banner and session limit (0 is unlimited).
listenAddress=${Login[externalAddress]}
port=${Ports[ssh]}
keyPairsDir=${mover.conf}/ssh/keys
softwareVersion=ECPDS_SSHD
banner=${mover.conf}/ssh/welcome.txt
maxConcurrentSessions=0

[ReportCommand]
# Executables used to report mover-wide and per-host status.
mover=${mover.sh}/report
host=${mover.sh}/report $host $port $listenAddress

[TestModule]
# Non-operational mover test simulation: errors per count interval, initial
# delays (ms) and transfer rates (bytes/s).
errorsFrequency=1000
initialDownloadDelay=15
downloadedBytesPerSecond=1048576
initialUploadDelay=500
uploadedBytesPerSecond=1048576

[Other]
# Shared I/O buffer size (bytes) and temporary-file directory.
buffer=131072
tmp=${mover.tmp}

# Allow overriding some options/parameters in this file
#
#include "${mover.etc}/ecmwf.properties"
